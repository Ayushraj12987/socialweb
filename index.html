<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Booster HUB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f6fb;
}

.container{
    padding:15px;
}

.card{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.box{
    background:#fafafa;
    padding:15px;
    border-radius:12px;
    border:1px solid #eaeaea;
}

h3{
    margin:5px 0 10px;
}

select,input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    margin-bottom:10px;
    font-size:14px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(45deg,#ff9800,#4caf50);
    color:white;
}

.desc{
    background:#f2f2f2;
    padding:10px;
    border-radius:10px;
    font-size:13px;
}

</style>
</head>
<body>

<div class="container">

<div class="card grid">
    <div class="box">
        <h3>User ID</h3>
        <div id="userid">Loading...</div>
    </div>
    <div class="box">
        <h3>Balance</h3>
        ₹<span id="balance">0.00</span>
    </div>
</div>

<div class="card">
    <h3>Category</h3>
    <select id="category"></select>

    <h3>Services</h3>
    <select id="service"></select>

    <h3>Description</h3>
    <div class="desc" id="description">Select service</div>

    <h3>Link</h3>
    <input type="text" id="link" placeholder="Enter Link">

    <h3>Quantity</h3>
    <input type="number" id="quantity" placeholder="Enter Quantity">

    <div id="minmax"></div>

    <h3>Charge</h3>
    ₹<input type="text" id="charge" readonly>

    <button onclick="submitOrder()">Submit</button>
</div>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

let services = [];
let categories = [];

const API_URL = "https://indiansmmprovider.in/api/v2";
const API_KEY = "YOUR_API_KEY_HERE";   // CHANGE THIS

document.getElementById("userid").innerText = tg.initDataUnsafe.user.id;

fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:key=${API_KEY}&action=services
})
.then(res=>res.json())
.then(data=>{
    services = data;
    categories = [...new Set(data.map(s=>s.category))];

    let catSelect = document.getElementById("category");
    categories.forEach(cat=>{
        let opt = document.createElement("option");
        opt.value = cat;
        opt.innerText = cat;
        catSelect.appendChild(opt);
    });

    loadServices();
});

document.getElementById("category").addEventListener("change", loadServices);
document.getElementById("service").addEventListener("change", updateDetails);
document.getElementById("quantity").addEventListener("input", calculate);

function loadServices(){
    let cat = document.getElementById("category").value;
    let filtered = services.filter(s=>s.category===cat);

    let servSelect = document.getElementById("service");
    servSelect.innerHTML="";

    filtered.forEach(s=>{
        let opt = document.createElement("option");
        opt.value = s.service;
        opt.innerText = s.service+" - "+s.name;
        servSelect.appendChild(opt);
    });

    updateDetails();
}

function updateDetails(){
    let id = document.getElementById("service").value;
    let s = services.find(x=>x.service==id);
    if(!s) return;

    document.getElementById("description").innerText = s.desc.replace(/<[^>]+>/g,'');
    document.getElementById("minmax").innerText = Min: ${s.min} - Max: ${s.max};
    calculate();
}

function calculate(){
    let id = document.getElementById("service").value;
    let qty = document.getElementById("quantity").value;
    let s = services.find(x=>x.service==id);
    if(!s || !qty) return;

    let cost = (s.rate/1000)*qty;
    let final = cost + (cost*0.20);
    document.getElementById("charge").value = final.toFixed(2);
}

function submitOrder(){
    let data = {
        service: document.getElementById("service").value,
        link: document.getElementById("link").value,
        quantity: document.getElementById("quantity").value
    };

    tg.sendData(JSON.stringify(data));
}

</script>

</body>
</html>
