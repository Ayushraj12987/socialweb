<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Social Booster Elite</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00f2ff;
            --accent: #7000ff;
            --bg: #05070a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(112, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 242, 255, 0.1) 0%, transparent 50%);
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Top Header */
        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(5, 7, 10, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 15px;
            border-radius: 20px;
            text-align: center;
        }

        .stat-card i { color: var(--primary); margin-bottom: 8px; font-size: 20px; }
        .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: bold; margin-top: 4px; }

        /* Main Container */
        .main-content { padding: 0 20px 100px 20px; }

        .glass-box {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-size: 13px; font-weight: 600; color: var(--text-muted); }

        select, input {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }

        select:focus, input:focus {
            border-color: var(--primary);
            background: rgba(0,242,255,0.05);
            outline: none;
        }

        /* Custom Price Tag */
        .price-container {
            background: linear-gradient(90deg, rgba(0,242,255,0.1), transparent);
            border-left: 4px solid var(--primary);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-label { font-size: 14px; font-weight: bold; }
        .price-value { font-size: 20px; color: var(--primary); font-weight: 800; }

        /* Action Button */
        .order-btn {
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(45deg, #00f2ff, #7000ff);
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 242, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .order-btn:active { transform: scale(0.96); }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
        }

        .nav-item { color: var(--text-muted); text-align: center; font-size: 11px; text-decoration: none; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { display: block; font-size: 20px; margin-bottom: 4px; }

        /* Shimmer Effect */
        .shimmer {
            position: relative; overflow: hidden;
        }
        .shimmer::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg); animation: shimmer 3s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }

    </style>
</head>
<body>

    <div class="header">
        <h1>SOCIAL BOOSTER <small style="font-size: 10px; vertical-align: middle; opacity: 0.6;">v2.0</small></h1>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <i class="fas fa-wallet"></i>
            <div class="stat-label">Your Balance</div>
            <div class="stat-value">₹<span id="balance">0.00</span></div>
        </div>
        <div class="stat-card">
            <i class="fas fa-fire"></i>
            <div class="stat-label">Active Orders</div>
            <div class="stat-value" id="active-orders">0</div>
        </div>
    </div>

    <div class="main-content">
        <div class="glass-box">
            <div class="input-group">
                <label><i class="fas fa-layer-group"></i> Choose Platform</label>
                <select id="category"><option>Fetching Categories...</option></select>
            </div>

            <div class="input-group">
                <label><i class="fas fa-bolt"></i> Select Service</label>
                <select id="service"><option>Select Platform First</option></select>
            </div>

            <div class="input-group">
                <label><i class="fas fa-link"></i> Destination Link</label>
                <input type="text" id="link" placeholder="Paste link here...">
            </div>

            <div class="input-group">
                <label><i class="fas fa-sort-amount-up"></i> Quantity</label>
                <input type="number" id="quantity" placeholder="Min: 100">
            </div>

            <div class="price-container">
                <span class="price-label">ESTIMATED COST</span>
                <span class="price-value" id="price">₹0.00</span>
            </div>

            <button class="order-btn shimmer" onclick="placeOrder()">
                <i class="fas fa-shopping-cart"></i> CONFIRM ORDER
            </button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item active"><i class="fas fa-home"></i>Home</a>
        <a href="#" class="nav-item" onclick="tg.showAlert('Coming Soon: Order History')"><i class="fas fa-history"></i>History</a>
        <a href="#" class="nav-item" onclick="tg.showAlert('Support: @YourAdminID')"><i class="fas fa-headset"></i>Support</a>
    </div>

    <script>
        const BACKEND = "https://cement-microwave-object-faces.trycloudflare.com";
        const tg = window.Telegram.WebApp;
        let servicesData = [];
        let userId = "Unknown";

        // Initialization
        tg.ready();
        tg.expand();
        if(tg.initDataUnsafe?.user) {
            userId = tg.initDataUnsafe.user.id;
        }

        function refreshBalance() {
            fetch(${BACKEND}/balance/${userId})
            .then(res => res.json())
            .then(data => {
                if(data.balance !== undefined) {
                    document.getElementById("balance").innerText = parseFloat(data.balance).toFixed(2);
                }
            })
            .catch(e => console.error("Balance Error"));
        }

        // Fetch Services & Categories
        fetch(${BACKEND}/services)
        .then(res => res.json())
        .then(data => {
            servicesData = data;
            let categories = [...new Set(data.map(s => s.category))];
            let catSelect = document.getElementById("category");
            catSelect.innerHTML = "";
            categories.forEach(cat => {
                let option = new Option(cat, cat);
                catSelect.add(option);
            });
            catSelect.onchange = loadServices;
            loadServices();
            refreshBalance();
        });

        function loadServices() {
            let selectedCat = document.getElementById("category").value;
            let serviceSelect = document.getElementById("service");
            serviceSelect.innerHTML = "";
            servicesData.filter(s => s.category === selectedCat).forEach(s => {
                serviceSelect.add(new Option(s.name, s.service));
            });
            calculatePrice();
        }

        function calculatePrice() {
            let serviceId = document.getElementById("service").value;
            let qty = document.getElementById("quantity").value;
            let selected = servicesData.find(s => s.service == serviceId);
            
            if(selected && qty > 0) {
                let rate = parseFloat(selected.rate);
                let total = ((rate / 1000) * qty * 1.20).toFixed(2); // 20% margin
                document.getElementById("price").innerText = "₹" + total;
            } else {
                document.getElementById("price").innerText = "₹0.00";
            }
        }

        document.getElementById("quantity").oninput = calculatePrice;
        document.getElementById("service").onchange = calculatePrice;

        function placeOrder() {
            let service = document.getElementById("service").value;
            let link = document.getElementById("link").value;
            let qty = document.getElementById("quantity").value;

            if(!link || qty < 1) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert("Details sahi se bharo bhai!");
                return;
            }

            tg.showConfirm("Are you sure you want to place this order?", (confirm) => {
                if(confirm) {
                    fetch(${BACKEND}/order, {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ user_id: userId, service, link, quantity: qty })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === "success") {
                            tg.HapticFeedback.notificationOccurred('success');
                            tg.showAlert("🚀 Order Success! ID: " + data.order_id);
                            refreshBalance();
                        } else {
                            tg.showAlert("Error: " + data.message);
                        }
                    });
                }
            });
        }
    </script>
</body>
</html>
