<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Social Booster Hub - Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }

        /* Header Styles */
        .header {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 18px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .logo-section h2 { margin: 0; font-size: 18px; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .balance-badge { background: rgba(99, 102, 241, 0.2); padding: 8px 15px; border-radius: 30px; border: 1px solid var(--primary); font-weight: bold; font-size: 14px; }

        /* Form Card */
        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        label { display: block; margin-bottom: 8px; font-size: 13px; color: #94a3b8; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Custom Dropdowns */
        select, input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid rgba(255,255,255,0.1);
            padding: 14px;
            border-radius: 14px;
            color: white;
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        select:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }

        /* Info Box */
        .info-panel {
            background: rgba(99, 102, 241, 0.1);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px dashed rgba(99, 102, 241, 0.3);
        }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
        .info-item { display: flex; align-items: center; gap: 8px; color: #cbd5e1; }
        .info-item i { color: var(--primary); }

        /* Total Section */
        .total-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .total-price { font-size: 22px; font-weight: 800; color: #fff; }

        /* Button */
        .place-order-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .place-order-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-section">
            <h2>🚀 Social Booster Hub</h2>
            <small style="color: #94a3b8;">Futuristic SMM Solutions</small>
        </div>
        <div class="balance-badge">
            <i class="fas fa-wallet"></i> <span id="balance-val">₹0.00</span>
        </div>
    </div>

    <div class="main-card">
        <label><i class="fas fa-folder"></i> Select Category</label>
        <select id="category" onchange="loadServices()">
            <option value="ig_followers">📁 Instagram Followers [Guaranteed]</option>
            <option value="ig_likes">📁 Instagram Likes [Indian]</option>
            <option value="tg_members">📁 Telegram Members [Targeted]</option>
            <option value="yt_views">📁 YouTube Views [Non Drop]</option>
            <option value="fb_services">📁 Facebook Page Services</option>
            <option value="wa_services">📁 WhatsApp Channel Services</option>
        </select>

        <label><i class="fas fa-list-ul"></i> Choose Service</label>
        <select id="service" onchange="updateInfo()">
            </select>

        <div class="info-panel">
            <div class="info-grid" id="service-info">
                <div class="info-item"><i class="fas fa-clock"></i> <span>Start: 0-1h</span></div>
                <div class="info-item"><i class="fas fa-bolt"></i> <span>Speed: 50K/Day</span></div>
                <div class="info-item"><i class="fas fa-globe"></i> <span>Quality: High</span></div>
                <div class="info-item"><i class="fas fa-sync"></i> <span>Refill: 30 Days</span></div>
            </div>
            <div style="font-size: 11px; margin-top: 10px; color: #94a3b8;">* Min: 20 | Max: 1,000,000</div>
        </div>

        <label><i class="fas fa-link"></i> Target Link</label>
        <input type="text" id="target-link" placeholder="https://instagram.com/p/..." autocomplete="off">

        <label><i class="fas fa-sort-amount-up"></i> Quantity</label>
        <input type="number" id="qty" placeholder="Min: 100" oninput="calcTotal()">

        <div class="total-container">
            <span style="color: #94a3b8;">Grand Total:</span>
            <span class="total-price" id="total-val">₹0.00</span>
        </div>

        <button class="place-order-btn" onclick="sendOrder()">
            <i class="fas fa-shopping-cart"></i> PLACE ORDER NOW
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#0f172a';

        const serviceData = {
            ig_followers: [
                {id: 1, name: "Instagram Followers [R30] - ₹25", price: 25},
                {id: 2, name: "Instagram Followers [Indian 🇮🇳] - ₹60", price: 60},
                {id: 3, name: "Instagram Followers [Real Ads] - ₹150", price: 150}
            ],
            ig_likes: [
                {id: 4, name: "Instagram Likes [Super Fast] - ₹5", price: 5},
                {id: 5, name: "Instagram Likes [Indian 🇮🇳] - ₹12", price: 12}
            ],
            tg_members: [
                {id: 6, name: "Telegram Members [Non Drop] - ₹90", price: 90},
                {id: 7, name: "Telegram Online Members - ₹140", price: 140}
            ],
            yt_views: [
                {id: 8, name: "YouTube Views [Suggested] - ₹110", price: 110}
            ],
            fb_services: [
                {id: 9, name: "Facebook Page Likes + Follows - ₹180", price: 180}
            ],
            wa_services: [
                {id: 10, name: "WhatsApp Channel Followers - ₹250", price: 250}
            ]
        };

        function loadServices() {
            const cat = document.getElementById('category').value;
            const sSelect = document.getElementById('service');
            sSelect.innerHTML = serviceData[cat].map(s => <option value="${s.id}" data-price="${s.price}">${s.name}</option>).join('');
            calcTotal();
        }

        function calcTotal() {
            const qty = document.getElementById('qty').value || 0;
            const price = document.getElementById('service').selectedOptions[0].getAttribute('data-price');
            const total = (qty / 1000) * price;
            document.getElementById('total-val').innerText = "₹" + total.toFixed(2);
        }

        function sendOrder() {
            const link = document.getElementById('target-link').value;
            const qty = document.getElementById('qty').value;
            const service = document.getElementById('service').selectedOptions[0].text;
            const total = document.getElementById('total-val').innerText;

            if(!link || qty < 10) {
                tg.showAlert("❌ Please provide valid link and quantity!");
                return;
            }

            const data = {
                order_type: "SMM_ORDER",
                service: service,
                link: link,
                qty: qty,
                cost: total
            };

            tg.sendData(JSON.stringify(data));
        }

        window.onload = loadServices;
    </script>
</body>
</html>
