<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Booster Elite</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #00f2ff; --accent: #7000ff; --bg: #05070a; }
        body { background: var(--bg); color: white; font-family: sans-serif; padding: 15px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; backdrop-filter: blur(10px); }
        .balance-box { text-align: center; background: linear-gradient(45deg, rgba(0,242,255,0.1), rgba(112,0,255,0.1)); border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 1px solid var(--primary); }
        .balance-box span { font-size: 24px; font-weight: bold; color: var(--primary); }
        select, input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: 1px solid #333; background: #111; color: white; outline: none; }
        select:focus { border-color: var(--primary); }
        .price-tag { margin: 15px 0; font-weight: bold; color: var(--primary); text-align: right; }
        button { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(45deg, var(--primary), var(--accent)); color: white; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,242,255,0.3); }
        button:active { transform: scale(0.98); }
        label { font-size: 12px; color: #888; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <div class="balance-box">
        <p style="margin:0; font-size: 12px;">AVAILABLE BALANCE</p>
        ₹<span id="balance">0.00</span>
    </div>

    <div class="card">
        <label>CATEGORY</label>
        <select id="category"><option>Loading...</option></select>

        <label>SERVICE</label>
        <select id="service"><option>Select Category First</option></select>

        <label>LINK</label>
        <input type="text" id="link" placeholder="https://instagram.com/...">

        <label>QUANTITY</label>
        <input type="number" id="quantity" placeholder="Min 100">

        <div class="price-tag">Total: <span id="price">₹0.00</span></div>

        <button onclick="placeOrder()"><i class="fas fa-rocket"></i> PLACE ORDER</button>
    </div>

    <script>
        const BACKEND = "https://cement-microwave-object-faces.trycloudflare.com";
        const tg = window.Telegram.WebApp;
        let servicesData = [];
        let userId = tg.initDataUnsafe.user?.id || "Unknown";

        tg.expand();

        // 1. BALANCE FETCH (Jo tune pehle bola tha)
        function refreshBalance() {
            fetch(${BACKEND}/balance/${userId})
            .then(res => res.json())
            .then(data => {
                document.getElementById("balance").innerText = data.balance || "0.00";
            });
        }

        // 2. SERVICES FETCH (Jo link tune abhi diya)
        fetch(${BACKEND}/services)
        .then(res => res.json())
        .then(data => {
            servicesData = data;
            // Unique categories nikalne ke liye
            let categories = [...new Set(data.map(s => s.category))];
            let catSelect = document.getElementById("category");
            catSelect.innerHTML = "";
            
            categories.forEach(cat => {
                let option = new Option(cat, cat);
                catSelect.add(option);
            });

            catSelect.onchange = loadServices;
            loadServices(); // Pehli bar load karne ke liye
            refreshBalance();
        });

        function loadServices() {
            let selectedCat = document.getElementById("category").value;
            let serviceSelect = document.getElementById("service");
            serviceSelect.innerHTML = "";
            
            servicesData.filter(s => s.category === selectedCat).forEach(s => {
                serviceSelect.add(new Option(s.name, s.service));
            });
            calculatePrice();
        }

        function calculatePrice() {
            let serviceId = document.getElementById("service").value;
            let qty = document.getElementById("quantity").value;
            let selected = servicesData.find(s => s.service == serviceId);
            
            if(selected && qty > 0) {
                let total = ((parseFloat(selected.rate) / 1000) * qty * 1.20).toFixed(2);
                document.getElementById("price").innerText = "₹" + total;
            }
        }

        document.getElementById("quantity").oninput = calculatePrice;
        document.getElementById("service").onchange = calculatePrice;

        // 3. ORDER PLACE (Tera updated logic)
        function placeOrder() {
            let service = document.getElementById("service").value;
            let link = document.getElementById("link").value;
            let qty = document.getElementById("quantity").value;

            if(!link || qty < 1) {
                tg.showAlert("Bhai link aur quantity toh daal!");
                return;
            }

            fetch(${BACKEND}/order, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    user_id: userId,
                    service: service,
                    link: link,
                    quantity: qty
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    tg.showAlert("✅ Order Lag Gaya! ID: " + data.order_id);
                    refreshBalance();
                } else {
                    tg.showAlert("❌ Error: " + data.message);
                }
            });
        }
    </script>
</body>
</html>
