<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 15px; }
        .card { background: #1e293b; padding: 20px; border-radius: 15px; }
        .bal-box { background: #4338ca; padding: 10px; border-radius: 10px; text-align: center; margin-bottom: 20px; font-weight: bold; font-size: 1.2em; }
        select, input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #334155; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: #6366f1; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="bal-box" id="user-bal">₹0.00</div>
    <div class="card">
        <label>Category</label>
        <select id="cat" onchange="updateSvc()">
            <option value="ig">Instagram Followers</option>
            <option value="tg">Telegram Members</option>
        </select>
        
        <label>Service</label>
        <select id="svc" onchange="calc()"></select>
        
        <input type="text" id="link" placeholder="Paste Link Here">
        <input type="number" id="qty" placeholder="Quantity" oninput="calc()">
        
        <div style="text-align: right; font-weight: bold; margin: 10px 0;" id="total">Total: ₹0.00</div>
        <button class="btn" onclick="order()">PLACE ORDER</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const params = new URLSearchParams(window.location.search);
        document.getElementById('user-bal').innerText = "₹" + (params.get('balance') || "0.00");

        // Yaha apni Service ID aur per 1 unit price daalo
        const data = {
            "ig": [{id: 101, name: "IG Guaranteed - ₹80/k", p: 0.08}],
            "tg": [{id: 401, name: "TG Real Members - ₹120/k", p: 0.12}]
        };

        function updateSvc() {
            const s = document.getElementById('svc'); s.innerHTML = "";
            data[document.getElementById('cat').value].forEach(x => {
                let o = document.createElement('option'); o.value = x.id; o.dataset.p = x.p; o.innerText = x.name; s.appendChild(o);
            });
            calc();
        }

        function calc() {
            const q = document.getElementById('qty').value || 0;
            const p = document.getElementById('svc').selectedOptions[0]?.dataset.p || 0;
            document.getElementById('total').innerText = "Total: ₹" + (q * p).toFixed(2);
        }

        function order() {
            const res = {
                service_id: document.getElementById('svc').value,
                link: document.getElementById('link').value,
                qty: document.getElementById('qty').value,
                cost: document.getElementById('total').innerText.replace('Total: ', '')
            };
            if(!res.link || !res.qty) return alert("Fill all details!");
            tg.sendData(JSON.stringify(res)); // Bot ko data send karega
        }
        updateSvc();
    </script>
</body>
</html>
