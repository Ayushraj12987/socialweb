<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Booster Web</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; padding: 15px; margin: 0; }
        .bal-card { background: linear-gradient(135deg, #4338ca, #6366f1); padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .form-box { background: #1e293b; padding: 20px; border-radius: 15px; }
        label { font-size: 0.8em; color: #94a3b8; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .total-box { display: flex; justify-content: space-between; font-weight: bold; margin: 15px 0; font-size: 1.1em; color: #6366f1; }
        .btn-order { width: 100%; padding: 15px; background: #6366f1; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 1em; cursor: pointer; }
    </style>
</head>
<body>

    <div class="bal-card" id="display-bal">Balance: ₹0.00</div>

    <div class="form-box">
        <label>Select Category</label>
        <select id="category" onchange="updateSvc()">
            <option value="ig">Instagram Followers</option>
            <option value="yt">YouTube Views</option>
            <option value="tg">Telegram Members</option>
        </select>

        <label>Select Service</label>
        <select id="service" onchange="calcTotal()"></select>

        <label>Target Link</label>
        <input type="text" id="link" placeholder="Paste link here...">

        <label>Quantity</label>
        <input type="number" id="qty" placeholder="Min: 100" oninput="calcTotal()">

        <div class="total-box">
            <span>Total Price:</span>
            <span id="total-price">₹0.00</span>
        </div>

        <button class="btn-order" onclick="placeOrder()">PLACE ORDER NOW</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Fetch Balance from URL
        const params = new URLSearchParams(window.location.search);
        const currentBal = params.get('balance') || "0.00";
        document.getElementById('display-bal').innerText = "Wallet Balance: ₹" + currentBal;

        // Service Data (Add your Panel's Service IDs here)
        const services = {
            "ig": [{id: 4212, name: "IG Guaranteed Followers - ₹65/k", price: 0.065}],
            "yt": [{id: 2341, name: "YT Real Views - ₹120/k", price: 0.12}],
            "tg": [{id: 1102, name: "TG Fast Members - ₹90/k", price: 0.09}]
        };

        function updateSvc() {
            const cat = document.getElementById('category').value;
            const svcSelect = document.getElementById('service');
            svcSelect.innerHTML = "";
            services[cat].forEach(s => {
                let opt = document.createElement('option');
                opt.value = s.id;
                opt.dataset.price = s.price;
                opt.innerText = s.name;
                svcSelect.appendChild(opt);
            });
            calcTotal();
        }

        function calcTotal() {
            const qty = document.getElementById('qty').value || 0;
            const price = document.getElementById('service').selectedOptions[0]?.dataset.price || 0;
            document.getElementById('total-price').innerText = "₹" + (qty * price).toFixed(2);
        }

        function placeOrder() {
            const orderData = {
                service_id: document.getElementById('service').value,
                link: document.getElementById('link').value,
                qty: document.getElementById('qty').value,
                cost: document.getElementById('total-price').innerText
            };

            if(!orderData.link || orderData.qty < 10) {
                alert("Please enter valid link and quantity!");
                return;
            }

            tg.sendData(JSON.stringify(orderData));
        }

        // Initialize first time
        updateSvc();
    </script>
</body>
</html>
